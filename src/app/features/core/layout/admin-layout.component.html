<div class="flex h-screen bg-slate-100 font-sans overflow-hidden">
  <!-- Sidebar -->
  <nav class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl flex-shrink-0">
    <!-- Logo -->
    <div class="p-6 border-b border-slate-700">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center shadow">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold tracking-wide leading-none">{{appName}}</h3>
          <span class="text-xs text-indigo-300 font-medium">{{panelName}}</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <ul class="flex-1 overflow-y-auto py-4 space-y-1 px-3">
      <li class="px-2 pb-1 pt-2">
        <span class="text-xs uppercase tracking-widest text-slate-500 font-semibold">Workspace</span>
      </li>
      @for (nav of navs; track nav.url) {
      <li>
        <a routerLink="{{nav.url}}" routerLinkActive="bg-indigo-600 text-white"
          class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-all duration-150 text-sm font-medium">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          {{nav.title}}
        </a>
      </li>
      }
    </ul>

    <!-- Logout -->
    <div class="p-4 border-t border-slate-700">
      <button (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-red-400 hover:bg-red-600 hover:text-white transition-all duration-150 text-sm font-medium">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Logout
      </button>
    </div>
  </nav>

  <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Profile -->
        <div class="flex items-center gap-3 cursor-pointer group border-l border-slate-100 pl-4"
          (click)="toggleProfileModal()" title="View Profile">
          <div
            class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center group-hover:bg-indigo-200 transition-colors overflow-hidden">
            <!-- @if (userProfileImage) {
            <img [src]="userProfileImage" alt="Profile" class="w-8 h-8 rounded-full object-cover">
            } @else { -->
            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            </svg>
            <!-- } -->
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-semibold text-slate-700 leading-none">{{ currentUser()?.username || 'Guest' }}</span>
            <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">{{ currentUser()?.role || 'User' }}</span>
          </div>
        </div>
