<div class="flex justify-center items-center h-screen bg-gray-50">
  <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg animate-in">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-1">
        <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-gray-500 text-sm">Log in to your Textil ERP account</p>
      </div>

      <!-- Error Message -->
      @if (error) {
      <div class="bg-red-50 text-red-600 p-3 rounded-lg text-xs border border-red-100 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        {{ error }}
      </div>
      }

      <!-- Username -->
      <div class="flex flex-col gap-2">
        <label for="username" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Username</label>
        <input type="text" id="username" formControlName="username" placeholder="admin"
          class="border border-gray-200 rounded-lg p-3 transition-all focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-2">
        <label for="password" class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••"
          class="border border-gray-200 rounded-lg p-3 transition-all focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
      </div>

      <button type="submit" [disabled]="loginForm.invalid"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg p-3 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-blue-200 mt-2">
        Sign In
      </button>

      <p class="text-center text-xs text-gray-500">
        Don't have an account?
        <a routerLink="/auth/register" class="text-blue-600 font-bold hover:underline">Register now</a>
      </p>
    </form>
  </div>
</div>
