<div class="p-6 bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
      <button routerLink="/inventory" class="text-gray-400 hover:text-indigo-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      </button>
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">{{ isEdit ? 'Edit' : 'Create' }} Product</h1>
        <p class="text-gray-500 mt-1">Fill in the product details and configure size/color variants.</p>
      </div>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-50">General Information</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700 ml-1">Product Name</label>
            <input type="text" formControlName="name" placeholder="e.g. Premium Silk Scarf"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none">
          </div>

          <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700 ml-1">Category</label>
            <input type="text" formControlName="category" placeholder="e.g. Accessories"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none">
          </div>

          <div class="col-span-full space-y-2">
            <label class="text-sm font-bold text-gray-700 ml-1">Description</label>
            <textarea formControlName="description" rows="3" placeholder="Tell us about this product..."
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none resize-none"></textarea>
          </div>

          <div class="space-y-2">
            <label class="text-sm font-bold text-gray-700 ml-1 flex items-center gap-2">
              Low Stock Threshold
              <span
                class="text-[10px] bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded border border-amber-100 uppercase tracking-wider">Alert</span>
            </label>
            <input type="number" formControlName="lowStockThreshold"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none">
          </div>
        </div>
      </div>

      <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-6 pb-2 border-b border-gray-50">
          <h2 class="text-lg font-bold text-gray-900">Product Variants</h2>
          <button type="button" (click)="addVariant()"
            class="text-sm font-bold text-indigo-600 hover:text-indigo-700 flex items-center gap-1 group">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
              stroke="currentColor" class="w-4 h-4 group-hover:scale-110 transition-transform">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Add Variant
          </button>
        </div>

        <div formArrayName="variants" class="space-y-4">
          @for (variant of variantControls.controls; track $index; let i = $index) {
          <div [formGroupName]="i"
            class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 rounded-xl border border-gray-100 bg-gray-50/50 relative group">
            <div class="space-y-1">
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Size</label>
              <input type="text" formControlName="size"
                class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all bg-white">
            </div>
            <div class="space-y-1">
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Color</label>
              <input type="text" formControlName="color"
                class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all bg-white">
            </div>
            <div class="space-y-1">
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">SKU</label>
              <input type="text" formControlName="sku"
                class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all bg-white font-mono">
            </div>
            <div class="space-y-1">
              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Initial Stock</label>
              <div class="flex items-center gap-2">
                <input type="number" formControlName="currentStock"
                  class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-sm transition-all bg-white">
                @if (variantControls.length > 1) {
                <button type="button" (click)="removeVariant(i)"
                  class="text-gray-300 hover:text-rose-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                  </svg>
                </button>
                }
              </div>
            </div>
          </div>
          }
        </div>
      </div>

      <div class="flex justify-end pt-4">
        <button type="submit" [disabled]="productForm.invalid"
          class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-2 transform active:scale-95">
          {{ isEdit ? 'Update' : 'Create' }} Product
        </button>
      </div>
    </form>
  </div>
</div>
